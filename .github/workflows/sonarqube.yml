name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ استنساخ الكود
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ تثبيت Java 17 (مطلوب لتشغيل SonarScanner)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ تفعيل الكاش لتسريع التحليل
      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # 4️⃣ تعطيل JRE provisioning نهائيًا لتجنب خطأ 404
      - name: Disable JRE provisioning
        run: echo "SONAR_SCANNER_OPTS=-Dsonar.scanner.provisioning.enable=false" >> $GITHUB_ENV

      # 5️⃣ تشغيل التحليل مع استبعاد الملفات الكبيرة والفيديوهات
      - name: Run SonarQube Scan
        run: |
          sonar-scanner \
            -Dsonar.projectBaseDir=9antraFormationFrant \
            -Dsonar.exclusions=**/*.mp4,**/*.mkv,**/src/assets/Records/**,**/src/assets/adminProjects/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
