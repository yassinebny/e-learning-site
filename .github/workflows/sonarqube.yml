name: Build & Analyze Backend

on:
  push:
    branches:
      - main

jobs:
  sonar-backend:
    name: SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Install SonarScanner CLI
      - name: Install SonarScanner CLI
        run: |
          SCANNER_VERSION=7.2.0.5079
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SCANNER_VERSION-linux-x64.zip -O sonar-scanner.zip
          unzip -q sonar-scanner.zip
          mv sonar-scanner-$SCANNER_VERSION-linux-x64 $HOME/sonar-scanner
          echo "$HOME/sonar-scanner/bin" >> $GITHUB_PATH

      # Step 4: Build Backend (compile Java classes)
      - name: Build Backend
        run: |
          cd 9antrakidsFormationBack
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

      # (Optional) Debug to verify compiled classes exist
      - name: Debug - Check classes folder
        run: |
          ls -l 9antrakidsFormationBack/target/classes

      # Step 5: Run SonarQube scan for Backend
      - name: Run SonarQube Scan (Backend)
        run: |
          sonar-scanner \
            -Dsonar.projectKey=e-9antrakids-sonar \
            -Dsonar.projectName="E-9antraKids Backend" \
            -Dsonar.projectVersion=1.0 \
            -Dsonar.projectBaseDir=9antrakidsFormationBack \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=9antrakidsFormationBack/target/classes \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
