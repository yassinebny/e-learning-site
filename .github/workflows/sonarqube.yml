name: Build & Analyze Backend

on:
  push:
    branches:
      - main

jobs:
  sonar-backend:
    name: SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner CLI
        run: |
          SCANNER_VERSION=4.16.0.5274
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SCANNER_VERSION-linux.zip -O sonar-scanner.zip
          unzip -q sonar-scanner.zip
          mv sonar-scanner-$SCANNER_VERSION-linux $HOME/sonar-scanner
          echo "$HOME/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Build Backend
        run: |
          cd 9antrakidsFormationBack
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

      - name: Ensure compiled classes exist
        run: |
          cd 9antrakidsFormationBack
          if [ ! -d "target/classes" ]; then
            ./mvnw install -DskipTests
          fi
          ls -l target/classes

      - name: Run SonarQube Scan (Backend)
        run: |
          sonar-scanner \
            -Dsonar.projectKey=E-9antraKids-Backend \
            -Dsonar.projectName="E-9antraKids Backend" \
            -Dsonar.projectVersion=1.0 \
            -Dsonar.projectBaseDir=9antrakidsFormationBack \
            -Dsonar.sources=9antrakidsFormationBack/src \
            -Dsonar.java.binaries=9antrakidsFormationBack/target/classes \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.scanner.skipJreProvisioning=true
