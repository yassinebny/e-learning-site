name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]  # إعادة المحاولة 3 مرات

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # مهم لتفادي مشاكل التحليل مع SonarQube

      # تثبيت Java 17 قبل تشغيل SonarScanner
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # تفعيل الكاش لتسريع التحليل وتفادي إعادة تحميل الـ Plugins
      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # تشغيل التحليل مع تعطيل ميزة JRE provisioning
      - name: Run SonarQube Scan (attempt ${{ matrix.attempt }})
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: 9antraFormationFrant
          args: >
            -Dsonar.scanner.provisioning.enable=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # إذا أردت فشل الـ Job عند Quality Gate أحمر، أزل التعليق عن هذه الأسطر
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
