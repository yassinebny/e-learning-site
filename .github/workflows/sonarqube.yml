name: SonarQube Analysis - Backend

on:
  push:
    branches:
      - main

jobs:
  backend:
    name: SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Build Backend (Maven)
      - name: Build Backend
        run: mvn clean compile
        working-directory: 9antrakidsFormationBack

      # Step 4: Run SonarQube Scan for Backend
      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=e-9antrakids-backend
            -Dsonar.projectName="E-9antraKids Backend"
            -Dsonar.projectVersion=1.0
            -Dsonar.projectBaseDir=9antrakidsFormationBack
            -Dsonar.sources=src
            -Dsonar.java.binaries=target/classes

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
