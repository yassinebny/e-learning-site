name: Build and Analyze Backend

on:
  push:
    branches:
      - main

jobs:
  sonar-backend:
    name: SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for accurate analysis

      # ✅ Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Step 3: Install SonarScanner CLI
      - name: Install SonarScanner CLI
        run: |
          SCANNER_VERSION=7.2.0.5079
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SCANNER_VERSION-linux-x64.zip -O sonar-scanner.zip
          unzip -q sonar-scanner.zip
          mv sonar-scanner-$SCANNER_VERSION-linux-x64 $HOME/sonar-scanner
          echo "$HOME/sonar-scanner/bin" >> $GITHUB_PATH

      # ✅ Step 4: Clear Sonar cache to avoid plugin checksum errors
      - name: Clear SonarQube cache
        run: rm -rf $HOME/.sonar/_tmp

      # ✅ Step 5: Run SonarQube scan for Backend
      - name: Run SonarQube Scan (Backend)
        run: |
          sonar-scanner \
            -Dsonar.projectKey=e-9antrakids-backend \
            -Dsonar.projectName="E-9antraKids Backend" \
            -Dsonar.projectVersion=1.0 \
            -Dsonar.projectBaseDir=9antrakidsFormationBack \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.scanner.forceDownload=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ✅ Step 6 (Optional): Check Quality Gate
      # - name: Check SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
