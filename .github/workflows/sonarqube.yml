name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # تعطيل JRE provisioning
      - name: Disable JRE provisioning
        run: echo "SONAR_SCANNER_OPTS=-Dsonar.scanner.provisioning.enable=false" >> $GITHUB_ENV

      - name: Run SonarQube Scan with Retry
        run: |
          for i in 1 2 3; do
            sonar-scanner -Dsonar.projectBaseDir=9antraFormationFrant \
              -Dsonar.exclusions=**/*.mp4,**/*.mkv,**/src/assets/Records/**,**/src/assets/adminProjects/** && break
            echo "Retry $i/3"
            sleep 10
          done
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
