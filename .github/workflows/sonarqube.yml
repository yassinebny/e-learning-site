name: Build & Analyze Backend

on:
  push:
    branches:
      - main

jobs:
  sonar-backend:
    name: SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Install SonarScanner CLI
      - name: Install SonarScanner CLI
        run: |
          SCANNER_VERSION=7.2.0.5079
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SCANNER_VERSION-linux-x64.zip -O sonar-scanner.zip
          unzip -q sonar-scanner.zip
          mv sonar-scanner-$SCANNER_VERSION-linux-x64 $HOME/sonar-scanner
          echo "$HOME/sonar-scanner/bin" >> $GITHUB_PATH

      # ✅ Build Backend
      - name: Build Backend
        run: |
          cd 9antrakidsFormationBack
          ./mvnw clean install -DskipTests

      # ✅ Run SonarQube Scan
      - name: Run SonarQube Scan (Backend)
        run: |
          cd 9antrakidsFormationBack
          sonar-scanner \
            -Dsonar.projectKey=e-9antrakids-sonar \
            -Dsonar.projectName="E-9antraKids Backend" \
            -Dsonar.projectVersion=1.0 \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
