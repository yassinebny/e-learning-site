name: Build & Analyze Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-sonar:
    name: Build and SonarQube Analysis - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Debug - List project folders
        run: |
          ls -l 9antrakidsFormationBack

      - name: Build and Run SonarQube Analysis
        run: |
          cd 9antrakidsFormationBack
          chmod +x mvnw
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey=E-9antraKids-Backend \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
